# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master, feat/validator-spa ]
  pull_request:
    branches: [ master, feat/validator-spa ]
  # Manual runs publish the integration branch image (version tag only, never latest).
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'      
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"
    - name: Setup Maven settings.xml
      uses: whelk-io/maven-settings-xml-action@v22
      with:
        servers: '[{ "id": "lifstools-jfrog", "username": "${env.ARTIFACTORY_USERNAME_REF}", "password": "${env.ARTIFACTORY_TOKEN_REF}" }]'        
    # Pull requests and pushes to the integration branch only build and test;
    # images are published from master (and by manual dispatch on the integration branch).
    - name: Build and test with Maven
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master')
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: ./mvnw -B verify --file pom.xml
    # The version goes through a file because on a fresh runner ./mvnw prints
    # its Maven download progress to stdout.
    - name: Set Release version env variable
      if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/validator-spa')
      run: |
        ./mvnw -B -q help:evaluate -Dexpression=project.version -Doutput="$RUNNER_TEMP/version.txt" > /dev/null
        version=$(cat "$RUNNER_TEMP/version.txt")
        [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Unexpected project version: '$version'" >&2; exit 1; }
        echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
    # Jib pushes to the registry during package and reads the credentials
    # written by docker/login-action, so the login has to come first.
    - name: Login to LIFS Tools registry
      if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/validator-spa')
      uses: docker/login-action@v4
      with:
        registry: docker.lifs-tools.org
        username: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_USER }}
        password: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_PW }}
    # Jib builds one image per application module, named after its artifactId:
    #   docker.lifs-tools.org/lifs/mztab-validator-webapp
    #   docker.lifs-tools.org/lifs/mztab-validator-engine-2.0
    #   docker.lifs-tools.org/lifs/mztab-validator-engine-2.1
    # The pom's jib.to.image carries the version tag (an image reference without a tag would
    # mean :latest), so only the tags in jib.to.tags are pushed.
    # master: version and latest for all three. A release version (no -SNAPSHOT) leaves out the
    # engines on a jmzTab-m SNAPSHOT line, as a release build does (-DskipSnapshotEngines, spec E11).
    # A release version is first checked to depend only on released artifacts (the release profile's
    # requireReleaseDeps, jmzTab-m included); if it does not, this step fails and nothing is pushed.
    - name: Check that a release version depends only on released artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
          echo "Development version $RELEASE_VERSION: SNAPSHOT dependencies are allowed"
        else
          ./mvnw -B -Prelease -DskipSnapshotEngines -DskipTests validate --file pom.xml
        fi
    - name: Build and push docker images with Maven
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release_args=()
        [[ "$RELEASE_VERSION" == *-SNAPSHOT ]] || release_args=(-DskipSnapshotEngines)
        ./mvnw -B package -Pdocker "${release_args[@]}" "-Djib.to.tags=${RELEASE_VERSION},latest" --file pom.xml

    # Integration branch: pushes only the version tag (2.0.0-SNAPSHOT) of all three images, never latest.
    - name: Build and push integration branch docker images with Maven
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/validator-spa'
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: ./mvnw -B package -Pdocker "-Djib.to.tags=${RELEASE_VERSION}" --file pom.xml

  # End-to-end tests of the SPA against the packaged jar (not part of ./mvnw verify).
  e2e:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Maven settings.xml
      uses: whelk-io/maven-settings-xml-action@v22
      with:
        servers: '[{ "id": "lifstools-jfrog", "username": "${env.ARTIFACTORY_USERNAME_REF}", "password": "${env.ARTIFACTORY_TOKEN_REF}" }]'
    - name: Build the jar
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: ./mvnw -B package -DskipTests --file pom.xml
    # The frontend build installs Node under frontend/node; the e2e tests use the same one.
    - name: Use the Maven-installed Node
      run: echo "$GITHUB_WORKSPACE/frontend/node" >> "$GITHUB_PATH"
    # The engines first: the webapp validates through them (2.0 on 8084, 2.1 on 8085).
    - name: Start the server
      run: |
        start_engine() {
          line="$1"; port="$2"
          jar=$(ls engine-mztabm-$line/target/mztab-validator-engine-$line-*.jar | grep -v '\.original$' | head -n 1)
          nohup java -jar "$jar" --server.port=$port > "$RUNNER_TEMP/engine-$line.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/engine-$line.pid"
          for i in $(seq 1 120); do
            if curl -sf http://localhost:$port/actuator/health | grep -q '"status":"UP"'; then
              echo "mzTab-M $line engine is up"; return 0
            fi
            sleep 1
          done
          echo "mzTab-M $line engine did not start" >&2; cat "$RUNNER_TEMP/engine-$line.log" >&2; exit 1
        }
        start_engine 2.0 8084
        start_engine 2.1 8085
        jar=$(ls server/target/mztab-validator-webapp-*.jar | grep -v '\.original$' | head -n 1)
        nohup java -jar "$jar" --server.port=8083 --server.servlet.contextPath=/mztabvalidator \
          --storage.location="$RUNNER_TEMP/storage" \
          "--engines.mztabm[0].line=2.0" "--engines.mztabm[0].url=http://localhost:8084" \
          "--engines.mztabm[1].line=2.1" "--engines.mztabm[1].url=http://localhost:8085" \
          > "$RUNNER_TEMP/server.log" 2>&1 &
        for i in $(seq 1 120); do
          if curl -sf http://localhost:8083/mztabvalidator/actuator/health | grep -q '"status":"UP"'; then
            echo "Server is up"; exit 0
          fi
          sleep 1
        done
        echo "Server did not start" >&2; cat "$RUNNER_TEMP/server.log" >&2; exit 1
    - name: Install Playwright Chromium
      working-directory: frontend
      run: npx playwright install --with-deps chromium
    - name: Run end-to-end tests
      env:
        CI: 'true'
      run: npm --prefix frontend run e2e
    # The same webapp with the 2.1 engine gone: 2.1 files fail with the unavailable message, 2.0 still works.
    - name: Stop the mzTab-M 2.1 engine
      run: |
        kill "$(cat "$RUNNER_TEMP/engine-2.1.pid")"
        for i in $(seq 1 30); do
          if ! curl -s -o /dev/null http://localhost:8085/actuator/health; then
            echo "mzTab-M 2.1 engine stopped"; exit 0
          fi
          sleep 1
        done
        echo "mzTab-M 2.1 engine did not stop" >&2; exit 1
    - name: Run end-to-end tests without the 2.1 engine
      env:
        CI: 'true'
        E2E_ENGINE_DOWN: 'true'
      run: npm --prefix frontend run e2e -- --grep @engine-down
    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 7
    - name: Upload server log
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-server-log
        path: |
          ${{ runner.temp }}/server.log
          ${{ runner.temp }}/engine-2.0.log
          ${{ runner.temp }}/engine-2.1.log
        retention-days: 7
