<header class="bar">
  <a class="brand" routerLink="/">
    <img class="brand__logo" src="brand/lifs-bildmarke.png" alt="" width="37" height="46" />
    <span class="brand__name">mzTab-M Validator<small>LIFS Tools</small></span>
  </a>

  <nav class="nav" aria-label="Main">
    @for (item of items; track item.label) {
      @if (item.route) {
        <a
          class="nav__item"
          [routerLink]="item.route"
          routerLinkActive="nav__item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          >{{ item.label }}</a
        >
      } @else {
        <a class="nav__item" [href]="item.href" target="_blank" rel="noopener">{{ item.label }}</a>
      }
    }
  </nav>

  <a
    class="github"
    [href]="githubUrl"
    target="_blank"
    rel="noopener"
    aria-label="jmzTab-m-webapp on GitHub"
    title="jmzTab-m-webapp on GitHub"
  >
    <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false">
      <path
        fill="currentColor"
        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
      />
    </svg>
  </a>

  <button
    type="button"
    class="menu-button"
    aria-label="Open navigation menu"
    [matMenuTriggerFor]="navMenu"
  >
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <mat-menu #navMenu="matMenu" xPosition="before" class="app-bar-menu">
    @for (item of items; track item.label) {
      @if (item.route) {
        <a mat-menu-item [routerLink]="item.route">{{ item.label }}</a>
      } @else {
        <a mat-menu-item [href]="item.href" target="_blank" rel="noopener">{{ item.label }}</a>
      }
    }
    <a mat-menu-item [href]="githubUrl" target="_blank" rel="noopener">GitHub ↗</a>
  </mat-menu>
</header>
