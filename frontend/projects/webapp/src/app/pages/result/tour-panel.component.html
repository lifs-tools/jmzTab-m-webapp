<section class="tour lifs-card" aria-labelledby="tour-step-title">
  <p class="lifs-label">{{ tour().title }}</p>
  @if (step(); as s) {
    <div aria-live="polite">
      <p class="pos">Step {{ index() + 1 }} of {{ steps().length }}</p>
      <h2 id="tour-step-title">{{ s.title }}</h2>
    </div>
    <p>{{ s.text }}</p>
    @if (s.lookFor) {
      <p class="look-for"><strong>Look for:</strong> {{ s.lookFor }}</p>
    }
  }
  <div class="actions">
    <button #backButton mat-stroked-button type="button" [disabled]="index() === 0" (click)="onBack()">{{ labels.back }}</button>
    @if (last()) {
      <a #ownFile mat-flat-button routerLink="/">{{ labels.ownFile }}</a>
    } @else {
      <button #nextButton mat-flat-button type="button" (click)="onNext()">{{ labels.next }}</button>
    }
    <button mat-button type="button" class="close" (click)="close.emit()">{{ labels.close }}</button>
  </div>
  @if (counterpartOffered() && counterpartVersion(); as version) {
    <p class="switch">
      <button type="button" class="switch-button" (click)="switchVersion.emit()">
        {{ switchLabel(version) }}
      </button>
    </p>
  }
</section>
