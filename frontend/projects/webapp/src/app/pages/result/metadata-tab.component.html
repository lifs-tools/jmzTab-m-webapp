@if (groups.isLoading()) {
  <mat-progress-bar mode="indeterminate" aria-label="Loading metadata" />
} @else if (groups.error()) {
  <p class="lifs-note" role="alert">The metadata could not be loaded.</p>
} @else {
  <mat-accordion multi>
    @for (g of groups.value() ?? []; track g.name; let first = $first) {
      <mat-expansion-panel [expanded]="first">
        <mat-expansion-panel-header>
          <mat-panel-title>{{ g.name }} ({{ g.count }})</mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
          <app-metadata-group [validationId]="validationId()" [group]="g.name ?? ''" [count]="g.count ?? 0" />
        </ng-template>
      </mat-expansion-panel>
    } @empty {
      <p class="lifs-note">No metadata.</p>
    }
  </mat-accordion>
}
