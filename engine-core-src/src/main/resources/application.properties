# Shared by every engine module; the @...@ values are filtered from the module's pom.
spring.application.name=mztab-validator-engine-@engine.line@
# the version line this engine validates, e.g. 2.0
engine.line=@engine.line@
# the declared mzTab-version values of that line, comma separated
engine.mztab-versions=@engine.mztab-versions@
engine.jmztabm-version=@engine.jmztabm-version@
server.port=@engine.port@
#at most this many validations and conversions run at once; more are refused with 503
#default: the number of processors
#engine.max-concurrent-jobs=4
#the Ontology Lookup Service of semantic validation: <protocol>://<host>/<base-path>/api/...
#the host may carry a port; the base path is a single segment. Defaults: the EBI OLS.
#engine.ols.protocol=https
#engine.ols.host=www.ebi.ac.uk
#engine.ols.base-path=ols

spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=70MB

# The webapp reaches engines on an internal network only; no authentication.
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoints.web.exposure.include=health,info

# the contract lists its error responses explicitly; no generic responses from the error advice
springdoc.override-with-generic-response=false

# messages are English whatever the client's language, e.g. those of Bean Validation
spring.web.locale=en
spring.web.locale-resolver=fixed

logging.level.org.springframework.web=INFO
logging.level.org.lifstools=INFO
logging.level.uk.ac.ebi=INFO
