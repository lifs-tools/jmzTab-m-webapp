spring.profiles.active=@spring.profiles.active@
app.version.number=@application.version.number@
app.build.date=@timestamp@
app.scm.commit.id=@buildNumber@
app.scm.branch=@scmBranch@
app.scm.location=@project.scm.url@
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
server.port=8083
# if ga.id is set, than google analytics will we be added to each page
ga.id=@ga.id@
ga.url=@ga.url@
ga.app.url=@ga.app.url@
server.servlet.contextPath=@contextPath@
storage.location=${java.io.tmpdir}/upload-dir
#new validations are refused while the stored files take up at least this many bytes (default 10 GiB)
storage.max-total-bytes=10737418240
#minimum age of user directories to clean up
minCleanupAge=7
#execute at 11pm every day
oldFileMaintenanceSchedule=0 0 23 * * *
logging.level.org.springframework.web=INFO
logging.level.org.lifstools=INFO
logging.level.uk.ac.ebi=INFO

spring.application.name=mztab-validator

# Disable Eureka by default; activate with spring.profiles.active=microservice
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
# Explicitly disable Bootstrap context (spring-cloud-context is on classpath via Eureka starter)
spring.cloud.bootstrap.enabled=false

# Trust X-Forwarded-* headers from the gateway
server.forward-headers-strategy=FRAMEWORK

# Actuator: expose health and info for Eureka health checks and status pages
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
validation.custom-mappings.enabled=true
#at most this many synchronous validations and conversions (/rest/v2/validate, /validatePlain, /convert,
#/convertPlain) run at once; default: the number of processors
#rest.synchronous.max-concurrent=4
#how long such a request waits for a free slot before it answers 503
rest.synchronous.wait=10s

# analytics tracker used when ga.id is set
matomo.tracker-base=https://lifs-tools.org/matomo/

# The validation engines, one per mzTab-M version line. A file declaring a version is validated by the engine of
# its line; a file declaring none by the default line, for which an engine must be configured.
# Environment: ENGINES_MZTABM_0_LINE, ENGINES_MZTABM_0_URL, ENGINES_MZTABM_1_LINE, ...
engines.default-line=2.0
engines.mztabm[0].line=2.0
engines.mztabm[0].url=http://mztab-engine-2-0:8084
engines.connect-timeout=5s
engines.job-timeout=10m
# where users are pointed when a version has no engine on this instance; empty for none
engines.unavailable-hint-url=
# an engine that is not reachable is UNAVAILABLE, which does not make the webapp DOWN (HTTP 200)
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,UP,UNAVAILABLE,UNKNOWN
management.endpoint.health.status.http-mapping.UNAVAILABLE=200
