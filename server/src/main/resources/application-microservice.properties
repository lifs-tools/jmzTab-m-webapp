# Microservice profile: enables Eureka registration with lipidcompass-registry

# Enable Eureka client
eureka.client.enabled=true
spring.cloud.discovery.enabled=true

# Eureka registry endpoint (matches LipidCompass default)
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:28092/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.client.registry-fetch-interval-seconds=10

# Instance metadata: use IP address to ensure the gateway can reach this instance
eureka.instance.prefer-ip-address=true

# Tell Eureka where the health check, status page, and home page are,
# relative to the instance host:port (include the context path /mztabvalidator)
eureka.instance.health-check-url-path=${server.servlet.contextPath}/actuator/health
eureka.instance.status-page-url-path=${server.servlet.contextPath}/actuator/info
eureka.instance.home-page-url-path=${server.servlet.contextPath}
