#
# Local development: the webapp and both mzTab-M engines as containers, as in
# production. The engines are reached on the compose network only, by their
# service names; only the webapp publishes a port.
#
# The containers run the packaged jars from the working tree, so build them first:
#
#   ./mvnw -B package -DskipTests
#   docker compose -f compose/dev-stack.yml up
#
# Then open http://localhost:8083/mztabvalidator/. Stop the 2.1 engine alone with
# `docker compose -f compose/dev-stack.yml stop mztab-engine-2-1`.
# Without Docker: scripts/run-dev-stack.sh starts the same three processes.

name: mztab-validator-dev

x-java: &java
  image: eclipse-temurin:25-jre
  working_dir: /app

services:
  mztab-engine-2-0:
    <<: *java
    volumes:
      - ../engine-mztabm-2.0/target:/app:ro
    command: ["sh", "-c", "exec java -XX:MaxRAMPercentage=75 -jar $$(ls /app/mztab-validator-engine-2.0-*.jar | grep -v original | head -n 1) --server.port=8084"]
    mem_limit: 2048m

  mztab-engine-2-1:
    <<: *java
    volumes:
      - ../engine-mztabm-2.1/target:/app:ro
    command: ["sh", "-c", "exec java -XX:MaxRAMPercentage=75 -jar $$(ls /app/mztab-validator-engine-2.1-*.jar | grep -v original | head -n 1) --server.port=8085"]
    mem_limit: 2048m

  webapp:
    <<: *java
    volumes:
      - ../server/target:/app:ro
      - webapp-storage:/storage
    command: ["sh", "-c", "exec java -XX:MaxRAMPercentage=75 -jar $$(ls /app/mztab-validator-webapp-*.jar | grep -v original | head -n 1) --server.port=8083 --server.servlet.contextPath=/mztabvalidator --storage.location=/storage"]
    environment:
      ENGINES_MZTABM_0_LINE: "2.0"
      ENGINES_MZTABM_0_URL: http://mztab-engine-2-0:8084
      ENGINES_MZTABM_1_LINE: "2.1"
      ENGINES_MZTABM_1_URL: http://mztab-engine-2-1:8085
    ports:
      - "8083:8083"
    depends_on:
      - mztab-engine-2-0
      - mztab-engine-2-1
    mem_limit: 1024m

volumes:
  webapp-storage:
