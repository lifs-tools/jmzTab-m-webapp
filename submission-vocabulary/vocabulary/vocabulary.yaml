# The submission vocabulary 1.3.0: field dictionary of the LipidCompass submission template v3.
# Field keys are kept as in the v3 schema. See ../README.md.

vocabulary:
  id: submission-vocabulary
  version: 1.3.0
  licence: CC-BY-4.0
  origin: "lipidcompass-submission-template 3.0.0 (lipidcompass-submissions bb8dcbf)"

conventions:
  table_sheets: "row 1 = field ids, row 2 = labels, data from row 3"
  study_sheet: "column A = field id, column C = value"
  samples_factor_columns: "row 1 = 'factor', row 2 = factor name"
  quantities_sheets: "Q_<dataset id>; numbers from B3. Datasets.quantities_layout 'lipids in columns' (default): A3.. sample names, B2.. lipid names; 'lipids in rows': A3.. lipid names, B2.. sample names"
  cv_value: "'label [ACCESSION]'; any other text is free text for the curators to map"

groups:
  study:
    workbook: true
    fields:
      - id: "study_title"
        label: "Study title"
        required: true
        mztab: "title"
        help: "The title of the publication, or of the study if it is unpublished."
        example: "Plasma lipidome of healthy adults and patients with type 2 diabetes"
      - id: "study_description"
        label: "Study description"
        required: true
        mztab: "description"
        help: "Two to five sentences: aim, cohort or samples, design. Datasets are described on the Datasets sheet."
        example: "Targeted plasma lipidomics of 40 adults (20 with type 2 diabetes, 20 controls), measured by RP-LC-MS/MS in positive and negative mode."
      - id: "study_type"
        label: "Study type"
        required: true
        list: "study_type"
        help: "Lipidome study (many classes), technical study (method development, few classes), reference material study, or ring trial study (several laboratories measure the same samples; one dataset per laboratory, named in Measuring laboratory)."
        example: "Lipidome study"
      - id: "publication_doi"
        label: "Publication DOI"
        required: "true, or 'unpublished'"
        type: "doi"
        mztab: "publication[1]"
        help: "DOI of the article that reports these data, starting with 10. Write 'unpublished' and send us the manuscript if there is none yet."
        example: "10.1234/example.2026.001"
      - id: "related_dois"
        label: "Related publication DOIs"
        required: false
        type: "doi"
        mztab: "publication[2..n]"
        help: "Companion papers or the methods paper, separated by ';'."
        example: ""
      - id: "pubmed_id"
        label: "PubMed ID"
        required: false
        mztab: "publication[1]"
        help: "PMID of the article, if it has one."
        example: ""
      - id: "licence"
        label: "Data licence"
        required: true
        list: "licence"
        help: "Licence for the data you submit. CC-BY-4.0 is recommended; other licences are checked by the curators (P21). Proprietary: LipidCompass may display the data, but neither the submissions repository nor LipidCompass makes them available for download by default (access-controlled data, e.g. sensitive data); describe the access conditions below."
        example: "CC-BY-4.0"
      - id: "access_conditions"
        label: "Data access conditions"
        required: "if Proprietary"
        help: "Only for Proprietary data: who may get access to the data, and how (contact, data access committee, agreement)."
        example: ""
      - id: "embargo_until"
        label: "Embargo until"
        required: false
        type: "date"
        help: "Date (YYYY-MM-DD) before which the data must not be published, e.g. the expected publication date."
        example: ""
      - id: "repository_links"
        label: "Raw data repository links"
        required: "recommended"
        type: "url"
        mztab: "external_study_uri[n]"
        help: "Links to the raw data, e.g. MetaboLights, Metabolomics Workbench or Zenodo, separated by ';'."
        example: "https://www.ebi.ac.uk/metabolights/MTBLS0000"
      - id: "lipidomics_checklist_doi"
        label: "Lipidomics Minimal Reporting Checklist DOI"
        required: "recommended"
        type: "doi"
        help: "DOI or URL of your completed Lipidomics Standards Initiative reporting checklist."
        example: ""
      - id: "lipid_nomenclature"
        label: "Lipid nomenclature used"
        required: "recommended"
        list: "lipid_nomenclature"
        help: "How lipid names on the quantities sheets are written. Shorthand 2020 (Liebisch et al.) is preferred."
        example: "Shorthand 2020 (Liebisch et al., Goslin-compatible)"
      - id: "submitter_comment"
        label: "Comments for the curators"
        required: false
        help: "Anything the curators should know (special sample types, data processing, deviations from the template)."
        example: ""
      - id: "lcs_id"
        label: "LipidCompass study id"
        required: "filled in by curation"
        mztab: "mzTab-ID (prefix)"
        help: "Assigned by the curators (LCS-XXXXX). Leave empty."
        example: ""
  contacts:
    workbook: true
    fields:
      - id: "name"
        label: "Name"
        required: true
        mztab: "contact[n]-name"
        help: "Full name."
        example: "Jane Doe"
      - id: "email"
        label: "E-mail"
        required: true
        type: "email"
        mztab: "contact[n]-email"
        help: "Work e-mail address."
        example: "jane.doe@example.org"
      - id: "affiliation"
        label: "Affiliation"
        required: true
        mztab: "contact[n]-affiliation"
        help: "Institute, university, city, country."
        example: "Institute of Example Lipidomics, Example University, Example City, Country"
      - id: "orcid"
        label: "ORCID"
        required: "recommended"
        type: "orcid"
        mztab: "contact[n]-orcid"
        help: "16-digit ORCID iD (https://orcid.org)."
        example: "0000-0002-1825-0097"
      - id: "role"
        label: "Role"
        required: true
        list: "contact_role"
        help: "At least one corresponding author and one submitter (can be the same person)."
        example: "corresponding author"
  datasets:
    workbook: true
    fields:
      - id: "dataset_id"
        label: "Dataset id"
        required: true
        help: "Short id of your choice, e.g. D1, D2. One dataset = consecutive measurements of one sample set with one method; positive and negative mode, different platforms, labs or cohorts are separate datasets."
        example: "D1"
      - id: "dataset_title"
        label: "Dataset title"
        required: true
        mztab: "title"
        help: "What this dataset is: matrix, method, mode, lab or cohort."
        example: "Plasma lipidome, RP-LC-MS/MS positive mode"
      - id: "dataset_description"
        label: "Dataset description"
        required: true
        mztab: "description"
        help: "Samples, method and anything that sets this dataset apart from the others."
        example: "40 plasma samples, RP-LC-MS/MS on a Q Exactive in positive mode; class-specific internal standards."
      - id: "dataset_content"
        label: "Dataset content"
        required: true
        list: "dataset_content"
        help: "Individual samples, or summary statistics per group (means / medians) when per-sample data are not available (P4, B21)."
        example: "individual samples"
      - id: "laboratory"
        label: "Measuring laboratory"
        required: "if several labs"
        help: "Laboratory that measured this dataset; needed when datasets of the study come from different labs or sites."
        example: "Example Lipidomics Core Facility"
      - id: "quantities_sheet"
        label: "Quantities sheet"
        required: true
        help: "Name of the sheet with this dataset's quantities (Q_<dataset id>). Copy a Q_ sheet for every further dataset."
        example: "Q_D1"
      - id: "quantities_layout"
        label: "Quantities layout"
        required: true
        list: "quantities_layout"
        help: "How the quantities sheet is arranged: samples in rows and lipids in columns, or lipids in rows and samples in columns (as many tools export). Choose per dataset."
        example: "lipids in columns"
      - id: "extraction_method"
        label: "Lipid extraction"
        required: true
        list: "extraction_method"
        mztab: "sample_processing[n]"
        help: "Extraction protocol; add details in 'Sample preparation details'."
        example: "MTBE extraction (Matyash)"
      - id: "sample_preparation"
        label: "Sample preparation details"
        required: false
        mztab: "sample_processing[n]"
        help: "Volumes, internal standards, derivatisation, storage."
        example: "20 uL plasma; SPLASH LIPIDOMIX added before extraction; dried under nitrogen, reconstituted in 100 uL methanol."
      - id: "separation_method"
        label: "Separation"
        required: true
        list: "separation_method"
        mztab: "sample_processing[n]"
        help: "Chromatography type, or direct infusion."
        example: "reversed-phase liquid chromatography"
      - id: "column"
        label: "Column"
        required: "if chromatography"
        mztab: "sample_processing[n]"
        help: "Commercial column name and dimensions."
        example: "Waters Acquity UPLC BEH C18, 2.1 x 100 mm, 1.7 um"
      - id: "separation_details"
        label: "Separation details"
        required: false
        mztab: "sample_processing[n]"
        help: "Solvents, gradient, flow."
        example: "A: ACN/H2O 60:40, B: IPA/ACN 90:10, both 10 mM ammonium formate; 20 min gradient"
      - id: "instrument_name"
        label: "Mass spectrometer"
        required: true
        list: "instrument_name"
        mztab: "instrument[n]-name"
        help: "Commercial instrument model."
        example: "Q Exactive"
      - id: "ion_source"
        label: "Ion source"
        required: true
        list: "ion_source"
        mztab: "instrument[n]-source"
        help: "Ionisation method."
        example: "electrospray ionization"
      - id: "analyzer"
        label: "Mass analyzer"
        required: "recommended"
        list: "analyzer"
        mztab: "instrument[n]-analyzer[k]"
        help: "Analyzer(s) used for the reported data."
        example: "orbitrap"
      - id: "detector"
        label: "Detector"
        required: false
        list: "detector"
        mztab: "instrument[n]-detector"
        help: "Detector type (Orbitrap instruments: inductive detector)."
        example: "inductive detector"
      - id: "scan_polarity"
        label: "Scan polarity"
        required: true
        list: "scan_polarity"
        mztab: "ms_run[n]-scan_polarity[k]"
        help: "Polarity of the reported data; both polarities in one dataset are allowed."
        example: "positive scan"
      - id: "acquisition_mode"
        label: "Acquisition mode"
        required: true
        list: "acquisition_mode"
        help: "DDA, DIA, SRM/MRM, PRM, precursor/neutral loss scans, or MS1 only."
        example: "data-dependent acquisition"
      - id: "dissociation_method"
        label: "Fragmentation (dissociation) method"
        required: "if MS/MS"
        list: "dissociation_method"
        mztab: "ms_run[n]-fragmentation_method[k]"
        help: "How ions were fragmented, e.g. CID, or HCD (= beam-type CID). Not the acquisition mode."
        example: "beam-type collision-induced dissociation"
      - id: "acquisition_software"
        label: "Acquisition software"
        required: false
        list: "software"
        mztab: "software[n]"
        help: "Instrument control software; its version goes in the next column."
        example: "Xcalibur"
      - id: "acquisition_software_version"
        label: "Acquisition software version"
        required: "recommended"
        type: "version"
        version_of: "acquisition_software"
        mztab: "software[n] (parameter value)"
        help: "Version of the acquisition software, e.g. 4.1. Leave empty if unknown (the curators get a warning)."
        example: "4.1"
      - id: "processing_software"
        label: "Identification / quantification software"
        required: true
        list: "software"
        mztab: "software[n]"
        help: "Software for identification and quantification; its version goes in the next column."
        example: "LipidSearch"
      - id: "processing_software_version"
        label: "Identification / quantification software version"
        required: "recommended"
        type: "version"
        version_of: "processing_software"
        mztab: "software[n] (parameter value)"
        help: "Version of the identification / quantification software, e.g. 4.2. Leave empty if unknown (the curators get a warning)."
        example: "4.2"
      - id: "identification_database"
        label: "Identification database / library"
        required: "recommended"
        mztab: "database[n]"
        help: "Database, spectral library or rule set used for identification."
        example: "LIPID MAPS LMSD (2025-06)"
      - id: "id_confidence_measure"
        label: "Identification confidence measure"
        required: "recommended"
        list: "id_confidence_measure"
        mztab: "id_confidence_measure[n]"
        help: "The score that supports identifications."
        example: "fragmentation score"
      - id: "identification_reliability"
        label: "Identification reliability scheme"
        required: "recommended"
        list: "identification_reliability"
        mztab: "small_molecule-identification_reliability"
        help: "The scheme of the per-lipid levels on the Lipids sheet (MSI levels 1-4)."
        example: "compound identification confidence level"
      - id: "quantification_method"
        label: "Quantification method"
        required: true
        list: "quantification_method"
        mztab: "quantification_method"
        help: "Absolute only for calibrated concentrations or amounts; IS-normalised ratios and raw intensities are relative (P6)."
        example: "absolute quantification"
      - id: "quantification_unit"
        label: "Quantification unit"
        required: true
        list: "quantification_unit"
        mztab: "small_molecule-quantification_unit"
        help: "Unit of the numbers on the quantities sheet. nmol/mL = umol/L; pmol/mL = nmol/L. Raw intensities: number of detector counts."
        example: "Micromole per Liter"
      - id: "data_processing_level"
        label: "What the numbers are"
        required: true
        list: "data_processing_level"
        help: "Concentrations, normalised ratios or raw intensities (B10)."
        example: "concentration (calibrated, absolute)"
      - id: "internal_standards"
        label: "Internal standards"
        required: "if used"
        help: "Internal standard mix and how it was used for normalisation. If the quantities include internal standards, mark them on the Lipids sheet."
        example: "SPLASH LIPIDOMIX (Avanti 330707), one standard per class"
      - id: "missing_value_encoding"
        label: "Missing values"
        required: true
        list: "missing_value_encoding"
        help: "How missing and below-LoD values are written (P12: empty = null)."
        example: "empty cell = not detected or not measured"
      - id: "raw_data_location"
        label: "Raw data of this dataset"
        required: false
        type: "url"
        mztab: "ms_run[n]-location"
        help: "Link to this dataset's raw files, if different from the study's repository link."
        example: ""
      - id: "dataset_comment"
        label: "Comments"
        required: false
        help: "Anything special about this dataset."
        example: ""
  samples:
    workbook: true
    fields:
      - id: "sample_name"
        label: "Sample name"
        required: true
        mztab: "sample[n]"
        help: "Unique name; exactly as in column A of the quantities sheets. A sample measured in several datasets is listed once."
        example: "P001"
      - id: "sample_type"
        label: "Sample type"
        required: true
        list: "sample_type"
        mztab: "sample[n]-description"
        help: "Individual sample, pooled sample, QC, blank or reference material (B21, B23.7)."
        example: "individual sample"
      - id: "species"
        label: "Species"
        required: true
        list: "species"
        mztab: "sample[n]-species[1]"
        ontologies: ["NCBITaxon"]
        help: "Most specific taxon (strain where known)."
        example: "Homo sapiens"
      - id: "tissue"
        label: "Tissue / matrix"
        required: "tissue or cell type"
        list: "tissue"
        mztab: "sample[n]-tissue[1]"
        ontologies: ["BTO", "UBERON"]
        help: "As stated in the Methods: EDTA/heparin/citrate tubes = plasma, clotted = serum (P2). BTO terms are preferred; UBERON terms (listed after the BTO terms) are accepted."
        example: "blood plasma"
      - id: "cell_type"
        label: "Cell type"
        required: "tissue or cell type"
        list: "cell_type"
        mztab: "sample[n]-cell_type[1]"
        ontologies: ["CL", "BTO"]
        help: "For isolated or cultured cells."
        example: ""
      - id: "disease"
        label: "Disease"
        required: "if applicable"
        list: "disease"
        mztab: "sample[n]-disease[1]"
        ontologies: ["NCIT", "DOID"]
        help: "Disease of the donor; controls: Control Group (P10). NCIT terms are preferred; Disease Ontology (DOID) terms (listed after the NCIT terms) are accepted."
        example: "Type 2 Diabetes Mellitus"
      - id: "sex"
        label: "Sex"
        required: "if known"
        list: "sex"
        mztab: "sample[n]-custom[k] (NCIT:C28421 Sex)"
        help: "Biological sex of the donor (P10)."
        example: "Female"
      - id: "age"
        label: "Age (years)"
        required: "if known"
        type: "number"
        mztab: "sample[n]-custom[k] (NCIT:C25150 Age)"
        help: "Age at sampling in years (use a factor column for other units)."
        example: "54"
      - id: "sample_description"
        label: "Sample description"
        required: false
        mztab: "sample[n]-description"
        help: "Free text, e.g. how a pooled sample was made."
        example: ""
  factors:
    workbook: true
    fields:
      - id: "factor_name"
        label: "Factor (column name)"
        required: true
        help: "A Samples column (sex, age, disease) or the name of a factor column added on the Samples sheet."
        example: "Disease"
      - id: "factor_term"
        label: "Factor term"
        required: "recommended"
        list: "factor"
        mztab: "study_variable[n]-factors"
        help: "What the factor is, as a CV term."
        example: "Disease or Disorder"
      - id: "unit"
        label: "Unit"
        required: "if numeric"
        help: "Unit of numeric factors, e.g. 'kg/m2'."
        example: ""
      - id: "primary"
        label: "Defines the study groups"
        required: true
        list: "yes_no"
        help: "'yes' for the factors the paper compares (become study variables); 'no' for covariates (B18)."
        example: "yes"
      - id: "factor_description"
        label: "Description"
        required: false
        help: "Optional."
        example: "Type 2 diabetes vs controls"
  lipids:
    workbook: true
    fields:
      - id: "dataset_id"
        label: "Dataset id"
        required: true
        help: "Dataset the lipid column belongs to."
        example: "D1"
      - id: "lipid_name"
        label: "Lipid name"
        required: true
        mztab: "chemical_name / opt_global_original_name"
        help: "Exactly as on the quantities sheet (row 2, or column A with lipids in rows)."
        example: "PC 16:0_18:1"
      - id: "sum_formula"
        label: "Sum formula (neutral)"
        required: false
        mztab: "chemical_formula"
        help: "Sum formula of the neutral lipid (no adduct), if you have it. The curators check it against the lipid name."
        example: "C42H82NO8P"
      - id: "internal_standard"
        label: "Internal standard?"
        required: false
        list: "yes_no"
        mztab: "opt_global_internal_standard"
        help: "'yes' for internal standards that are part of the quantities (kept and annotated, P6). If your lab removed them after quantification, there is nothing to mark."
        example: "no"
      - id: "identification_level"
        label: "Identification level"
        required: false
        list: "identification_level"
        mztab: "reliability"
        help: "Per-lipid level of the scheme on the Datasets sheet (MSI 1-4). Without a level, a lipid name in shorthand notation counts as level 3."
        example: "2"
      - id: "lipid_comment"
        label: "Comment"
        required: false
        help: "E.g. isomers summed, co-eluting species, sterol analyte (P7, P8)."
        example: ""
      - id: "alternative_name"
        label: "Alternative name"
        required: false
        mztab: "opt_global_alternative_name"
        help: "Optional second name for the same lipid, kept as written: for example a reading with more detail than the lipid name states, or a curator's interpretation. The lipid name stays the one that is normalised."
        example: ""
      - id: "normalise_name"
        label: "Normalise the name"
        required: false
        list: "yes_no"
        mztab: "database_identifier / chemical_name"
        help: "'no' when Goslin reads the lipid name as a different lipid: the name is then kept as written, with the database identifier goslin:null. Empty or 'yes': Goslin normalises the name where it can, if need be without a custom suffix or comment at its end."
        example: ""
  quantities:
    workbook: true
    help: "Layout 'lipids in columns' (default): one row per sample (column A: sample name exactly as on the Samples sheet), one column per lipid (row 2: lipid name in shorthand notation). Layout 'lipids in rows': column A holds the lipid names and row 2 the sample names. Set the layout per dataset on the Datasets sheet. Numbers only, from B3: decimal point, no units, no text; leave a cell empty when the lipid was not detected or not measured. Internal standards may stay; mark them on the Lipids sheet."
    fields: []
  runs:
    workbook: false
    fields:
      - id: "file_name"
        label: "File name"
        required: false
        type: "text"
        help: "Name of the data file (raw or mzML) as chosen on the researcher's computer; the file itself is not uploaded."
        example: "plasma_01.mzML"
      - id: "file_format"
        label: "File format"
        required: false
        type: "text"
        help: "Format of the data file, e.g. mzML or a vendor raw format."
        example: "mzML"
      - id: "paired_file"
        label: "Paired file"
        required: false
        type: "text"
        help: "The raw file for an mzML file, or the mzML file for a raw file."
        example: "plasma_01.raw"
      - id: "sample_name"
        label: "Sample"
        required: false
        type: "text"
        help: "Name of the measured sample, exactly as on the Samples sheet."
        example: "S01"
      - id: "assay"
        label: "Assay"
        required: false
        type: "text"
        help: "The assay this file belongs to; several files can share one assay."
        example: "A01"
      - id: "fraction_of"
        label: "Fraction of"
        required: false
        type: "text"
        help: "The file this fraction belongs to, if the sample was fractionated."
        example: ""
      - id: "scan_polarity"
        label: "Scan polarity"
        required: false
        list: "scan_polarity"
        mztab: "ms_run[n]-scan_polarity[k]"
        help: "Polarity of this file, from the mzML header; the dataset-level scan polarity is the fallback."
        example: "positive scan"
      - id: "instrument_name"
        label: "Mass spectrometer"
        required: false
        list: "instrument_name"
        mztab: "instrument[n]-name"
        help: "Instrument of this file, from the mzML header; the dataset-level mass spectrometer is the fallback."
        example: "Q Exactive"
      - id: "dissociation_method"
        label: "Fragmentation (dissociation) method"
        required: false
        list: "dissociation_method"
        mztab: "ms_run[n]-fragmentation_method[k]"
        help: "Fragmentation of this file, from the mzML header; the dataset-level method is the fallback."
        example: "beam-type collision-induced dissociation"
